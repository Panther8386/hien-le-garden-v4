name = "hien-le-garden-v4"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
PUBLIC_BOOKING_ALLOWED_HOSTNAMES = "hienlegarden.vn,www.hienlegarden.vn"

[[d1_databases]]
binding = "DB"
database_name = "hien_le_garden_crm"
database_id = "bf3ed73c-96de-494c-a3f9-e905f2bf8c48"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "hien-le-garden-finance-receipts"

# Preview/staging (any deploy with --branch other than the production branch "main").
# Non-inheritable: these fully replace the top-level (production) D1/R2 bindings.
# Gate: `npm run check:staging` must exit 0 before any remote command with --env preview.
[env.preview]

[env.preview.vars]
PUBLIC_BOOKING_ALLOWED_HOSTNAMES = "staging.hien-le-garden-v4.pages.dev"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "hien_le_garden_crm_staging"
database_id = "1e91a577-df12-4ff7-8730-c022be25a3c9"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "RECEIPTS"
bucket_name = "hien-le-garden-finance-receipts-staging"
