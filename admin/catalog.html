<!-- v4/admin/catalog.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bảng giá dịch vụ — Hiền Lê Garden CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="page page-wide">
    <h1>Bảng giá dịch vụ</h1>

    <div id="experienceSettingsSection" class="hidden">
      <h2>Cấu hình gợi ý khung giờ</h2>
      <form id="experienceSettingsForm">
        <label>Số ngày tìm gợi ý (khi hết chỗ) <input type="number" name="suggestionWindowDays" min="1" max="365" required /></label>
        <label>Số gợi ý tối đa hiển thị <input type="number" name="maxSuggestions" min="1" max="50" required /></label>
        <button type="submit">Lưu cấu hình</button>
        <p id="experienceSettingsError" class="error"></p>
      </form>
    </div>

    <div class="filters" id="catalogTabs">
      <button type="button" class="tab-btn active" data-category="luu_tru">Lưu Trú</button>
      <button type="button" class="tab-btn" data-category="fnb_hoat_dong">F&amp;B &amp; Hoạt Động</button>
      <button type="button" class="tab-btn" data-category="su_kien_team_building">Sự Kiện &amp; Team Building</button>
    </div>

    <form id="catalogForm" class="hidden">
      <input type="hidden" name="id" />
      <input type="hidden" name="category" />
      <label>Nhóm phụ (tuỳ chọn) <input type="text" name="subgroup" list="luuTruSubgroups" /></label>
      <datalist id="luuTruSubgroups">
        <option value="Lưu Trú Theo Đêm"></option>
        <option value="Giờ Xanh Hiền Lê"></option>
      </datalist>
      <label>Tên dịch vụ <input type="text" name="name" required /></label>
      <label class="checkbox"><input type="checkbox" name="isLabelPrice" /> Dùng nhãn tự do (VD: Miễn phí, Theo giá thị trường)</label>
      <label class="checkbox"><input type="checkbox" name="isScheduled" /> Có khung giờ + sức chứa (trải nghiệm)</label>
      <label id="termsField" class="hidden">Điều khoản &amp; điều kiện sử dụng dịch vụ (hiển thị cho lễ tân khi đăng ký)
        <textarea name="termsAndConditions" rows="4" placeholder="VD: Trẻ em dưới 12 tuổi cần người lớn đi kèm. Không hoàn phí nếu huỷ trong ngày..."></textarea>
      </label>
      <div class="form-row" id="priceRangeFields">
        <label>Giá A <input type="number" name="priceMin" min="0" step="1000" /></label>
        <label>Giá B (để trống nếu là giá cố định) <input type="number" name="priceMax" min="0" step="1000" /></label>
      </div>
      <label id="priceLabelField" class="hidden">Nhãn giá <input type="text" name="priceLabel" placeholder="VD: Miễn phí" /></label>
      <label>Đơn vị / Sức chứa <input type="text" name="unitCapacity" /></label>
      <label>Ghi chú <input type="text" name="note" /></label>
      <label id="roomTypeField" class="hidden">Liên kết loại phòng
        <select name="roomTypeKey">
          <option value="">Không liên kết</option>
          <option value="triangle">Triangle House</option>
          <option value="circle">Circle House</option>
          <option value="ede_cozy">Ê Đê Cozy House</option>
          <option value="vip">VIP House</option>
          <option value="bungalow">Bungalow Gia Đình</option>
          <option value="dormitory">Phòng Tập Thể</option>
        </select>
      </label>
      <button type="submit" id="catalogSubmitBtn">Thêm dịch vụ</button>
      <button type="button" id="catalogCancelBtn" class="btn-secondary">Huỷ</button>
      <p id="formError" class="error"></p>
    </form>

    <div id="slotTemplatesSection" class="hidden">
      <h3>Khung giờ &amp; sức chứa</h3>
      <p id="slotTemplatesError" class="error"></p>
      <div class="table-scroll">
        <table id="slotTemplatesTable">
          <thead><tr><th>Nhãn</th><th>Ngày trong tuần</th><th>Giờ bắt đầu</th><th>Sức chứa</th><th>Trạng thái</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <form id="slotTemplateForm">
        <input type="hidden" name="id" />
        <label>Nhãn (tuỳ chọn) <input type="text" name="label" placeholder="VD: Suất tối" /></label>
        <fieldset>
          <legend>Ngày trong tuần</legend>
          <label class="checkbox"><input type="checkbox" name="dow" value="1" /> T2</label>
          <label class="checkbox"><input type="checkbox" name="dow" value="2" /> T3</label>
          <label class="checkbox"><input type="checkbox" name="dow" value="3" /> T4</label>
          <label class="checkbox"><input type="checkbox" name="dow" value="4" /> T5</label>
          <label class="checkbox"><input type="checkbox" name="dow" value="5" /> T6</label>
          <label class="checkbox"><input type="checkbox" name="dow" value="6" /> T7</label>
          <label class="checkbox"><input type="checkbox" name="dow" value="0" /> CN</label>
        </fieldset>
        <label>Giờ bắt đầu <input type="time" name="startTime" required /></label>
        <label>Sức chứa (số khách) <input type="number" name="capacity" min="1" required /></label>
        <button type="submit" id="slotTemplateSubmitBtn">Thêm khung giờ</button>
        <button type="button" id="slotTemplateCancelBtn" class="btn-secondary">Huỷ</button>
      </form>
      <button type="button" id="addSlotTemplateBtn">+ Thêm khung giờ</button>
    </div>

    <button type="button" id="addServiceBtn" class="hidden">+ Thêm dịch vụ</button>

    <p id="listError" class="error"></p>
    <div class="table-scroll">
      <table id="catalogTable">
        <thead><tr><th>Tên</th><th>Giá A</th><th>Giá B</th><th>Đơn vị/Sức chứa</th><th>Ghi chú</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="/admin/catalog.js"></script>
  <script src="/admin/nav-drawer.js"></script>
</body>
</html>
